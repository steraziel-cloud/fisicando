<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GatitoMath – Scegli il tuo percorso</title>
  <meta name="description" content="Scegli il tuo ruolo e il livello di studio per entrare nei materiali didattici di GatitoMath.">
  <link rel="icon" type="image/png" href="assets/images/red-logo-head.png">
  <link rel="stylesheet" href="assets/reddito.css?v=5">
  <link rel="stylesheet" href="assets/gatitomath-wordmark.css?v=7">
  <link rel="stylesheet" href="assets/learning-shell.css?v=1">
  <link rel="stylesheet" href="assets/lezioni.css?v=2">
  <link rel="stylesheet" href="assets/percorsi-layout.css?v=6">
  <script src="assets/main.js" defer></script>
  <script src="assets/percorsi.js?v=4" defer></script>
</head>
<body class="rm-lessons-page">
  <header class="rm-topbar">
    <div class="rm-shell rm-topbar-inner">
      <a class="rm-logo rm-logo-art" href="index.html" aria-label="GatitoMath, Home"><img class="rm-logo-red" src="assets/images/red-logo-head.png" alt="" width="640" height="585" aria-hidden="true"><span class="rm-logo-name">Gatito<span>Math</span></span></a>
      <nav class="rm-nav" aria-label="Navigazione principale">
        <a href="index.html">Home</a>
        <a href="info.html">Il progetto</a>
        <a href="contatti.html">Contatti</a>
        <a class="active" href="percorsi.html">Lezioni online</a>
      </nav>
      <button id="theme-toggle" class="rm-theme" aria-label="Cambia tema">🌙</button>
    </div>
  </header>
  <main class="rm-lessons-main">
    <div class="rm-shell">
      <div class="rm-eyebrow">Lezioni online</div>
      <h1 class="rm-lessons-title">Da dove <span>partiamo?</span></h1>
      <p class="rm-lessons-lead">Raccontaci come ti avvicini a GatitoMath e quale livello di studio ti interessa.</p>
      <div class="rm-path-layout">
      <form class="rm-path-form" action="lezioni.html" method="get">
        <ol class="rm-path-progress" aria-label="Passaggi del percorso">
          <li data-path-progress="role" aria-current="step"><span aria-hidden="true">1</span> Chi sei</li>
          <li data-path-progress="level"><span aria-hidden="true">2</span> Grado di studio</li>
        </ol>
        <input type="hidden" name="ruolo" id="path-role" value="">
        <section class="rm-path-step" id="role-step" aria-labelledby="role-title">
          <h2 id="role-title" tabindex="-1">Chi sei?</h2>
          <div class="rm-choice-grid">
            <button class="rm-choice" type="button" data-role="studente"><span class="rm-choice-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span class="rm-choice-label">Studentessa/studente</span> <span aria-hidden="true">→</span></button>
            <button class="rm-choice" type="button" data-role="altro"><span class="rm-choice-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6z"/></svg></span><span class="rm-choice-label">Altro</span> <span aria-hidden="true">→</span></button>
          </div>
        </section>
        <section class="rm-path-step" id="level-step" aria-labelledby="level-title" hidden>
          <button class="rm-path-back" type="button" id="path-back"><span aria-hidden="true">←</span> Indietro</button>
          <h2 id="level-title" tabindex="-1">Quale grado di studio ti interessa?</h2>
          <p class="rm-path-role" id="path-role-label"></p>
          <div class="rm-choice-grid">
            <button class="rm-choice" type="submit" name="livello" value="elementari">Elementari <span aria-hidden="true">→</span></button>
            <button class="rm-choice" type="submit" name="livello" value="medie">Medie <span aria-hidden="true">→</span></button>
            <button class="rm-choice" type="submit" name="livello" value="biennio">Biennio superiori <span aria-hidden="true">→</span></button>
            <button class="rm-choice" type="submit" name="livello" value="triennio">Triennio superiori <span aria-hidden="true">→</span></button>
            <button class="rm-choice" type="submit" name="livello" value="universita">Università <span aria-hidden="true">→</span></button>
          </div>
        </section>
        <noscript><p>Per scegliere il percorso, attiva JavaScript oppure <a href="lezioni.html">esplora tutta la raccolta</a>.</p></noscript>
      </form>
      <div class="rm-path-art" aria-hidden="true">
        <span class="rm-welcome-decor rm-welcome-book"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M24 12C18 6 10 7 4 10v27c6-3 14-4 20 2 6-6 14-5 20-2V10c-6-3-14-4-20 2Z"/><path d="M24 12v27M10 16l8-1M10 23l8-1M30 15l8 1M30 22l8 1"/></svg></span>
        <span class="rm-welcome-decor rm-welcome-pi">π</span>
        <span class="rm-welcome-decor rm-welcome-star">✦</span>
        <span class="rm-welcome-decor rm-welcome-small-star">✦</span>
        <img src="assets/images/gatitomath-benvenuto.png" alt="" width="1254" height="1254" decoding="async" fetchpriority="high">
      </div>
      </div>
    </div>
  </main>
</body>
</html>
