<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisione responsiva · La materia</title><style>body{margin:0;background:#e5edee;font:16px system-ui;color:#294a4c}header{padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{font:inherit;padding:6px}main{display:flex;justify-content:center;padding:0 10px}iframe{background:white;width:390px;max-width:100%;height:1100px;border:1px solid #8caaa5;border-radius:8px}</style><header><strong>Revisione della lezione</strong><label>Larghezza <select id="width"><option value="390">Telefono · 390 px</option><option value="768">Tablet · 768 px</option><option value="1100">Desktop · 1100 px</option></select></label><label>Card <select id="card"><option value="atomi-elementi:1">Democrito</option><option value="elementi:1">Strutture delle carte</option><option value="simboli-tavola:1">Tavola periodica</option></select></label></header><main><iframe id="preview" title="Anteprima reader"></iframe></main><script>const frame=document.getElementById('preview'),width=document.getElementById('width'),card=document.getElementById('card');function load(){const [section,index]=card.value.split(':');frame.src='../reader.html?lezione=chimica-materia&livello=medie&sezione='+section+'&scheda='+index;}width.onchange=()=>frame.style.width=width.value+'px';card.onchange=load;load();</script></html>
