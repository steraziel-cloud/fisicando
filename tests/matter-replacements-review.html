<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materia — sei campioni rivisti</title>
<style>*{box-sizing:border-box}body{margin:24px;background:#f3f8fb;color:#24354b;font:16px system-ui}h1{font-size:25px;margin:0 0 6px}nav{margin-bottom:18px;display:flex;gap:24px;flex-wrap:wrap}a{color:#236a7e}#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{padding:12px 16px;border:1px solid #c8dae2;background:#eaf4fa;border-radius:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px;align-items:center}h2{grid-column:1/-1;margin:0;font-size:17px}img{width:100%;max-height:176px;object-fit:contain;border-radius:12px}svg{display:block;width:100%;height:176px}button{justify-self:end;grid-column:2;padding:6px 16px;border-radius:20px;border:1px solid #8eabb7;background:white;color:#24354b;cursor:pointer}@media(max-width:760px){#gallery{grid-template-columns:1fr}body{margin:16px}}</style>
<h1>Sei campioni più familiari</h1><nav><a href="../reader.html?lezione=chimica-materia&amp;livello=medie&amp;sezione=intorno-a-noi&amp;scheda=1">Apri il gioco</a><a href="matter-visual-review.html">Tutti i 18 modelli</a></nav><div id="gallery"></div>
<script src="../assets/reader-matter-models.js?v=5"></script><script src="../assets/reader-matter-cards.js?v=5"></script><script>
for(const id of ['acciaio','sabbia','alluminio','bicarbonato','diamante','ossigeno']){const d=GatitoMatterCards.deck.find(d=>d.id===id),a=document.createElement('article'),h=document.createElement('h2'),img=document.createElement('img'),model=document.createElement('div');h.textContent=d.name;img.src='../assets/images/reader/chemistry/cards/'+id+'.webp';img.alt=d.name;model.innerHTML=GatitoMatterModels.scene(d).svg;a.append(h,img,model);document.querySelector('#gallery').append(a);const paused=matchMedia('(prefers-reduced-motion: reduce)').matches,control=GatitoMatterModels.animate(model,d,GatitoMatterModels.createMotion(id),{paused}),button=document.createElement('button');button.textContent=paused?'Riprendi':'Pausa';button.onclick=()=>{control.setPaused(!control.paused);button.textContent=control.paused?'Riprendi':'Pausa';};a.append(button);window.addEventListener('pagehide',()=>control.dispose(),{once:true});}
</script>
