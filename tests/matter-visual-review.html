<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica interna — modelli della materia</title>
<style>body{margin:24px;background:#f3f8fb;color:#24354b;font:16px system-ui}h1{font-size:24px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article{padding:16px;border:1px solid #c8dae2;background:#eaf4fa;border-radius:18px}article h2{font-size:16px;margin:0 0 8px}svg{width:100%;height:auto}iframe{display:block;height:800px;border:2px solid #548f99;background:white;max-width:100%;margin-top:16px}button{padding:10px;margin:6px;cursor:pointer}nav{margin:20px 0}a{color:#236a7e}</style>
<h1>Verifica interna — 18 modelli</h1><a href="../reader.html?lezione=chimica-materia&amp;livello=medie&amp;sezione=intorno-a-noi&amp;scheda=1">Apri il gioco nel reader</a><div id="gallery"></div>
<h2>Reader a larghezze ridotte</h2><nav><button data-width="360">360 px</button><button data-width="600">600 px</button><button data-width="900">900 px</button></nav><iframe title="Verifica del reader" width="360" src="../reader.html?lezione=chimica-materia&amp;livello=medie&amp;sezione=intorno-a-noi&amp;scheda=1"></iframe>
<script src="../assets/reader-matter-models.js?v=2"></script><script src="../assets/reader-matter-cards.js?v=4"></script><script>for(const d of GatitoMatterCards.deck){const a=document.createElement('article'),h=document.createElement('h2');h.textContent=d.name;a.append(h);a.insertAdjacentHTML('beforeend',GatitoMatterModels.scene(d).svg);document.querySelector('#gallery').append(a);if(GatitoMatterModels.supportsMotion(d.id)){const paused=matchMedia('(prefers-reduced-motion: reduce)').matches,control=GatitoMatterModels.animate(a,d,GatitoMatterModels.createMotion(d.id),{paused}),button=document.createElement('button');button.textContent=paused?'Riprendi':'Pausa';button.onclick=()=>{control.setPaused(!control.paused);button.textContent=control.paused?'Riprendi':'Pausa';};a.append(button);window.addEventListener('pagehide',()=>control.dispose(),{once:true});}}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>document.querySelector('iframe').width=b.dataset.width);</script>
