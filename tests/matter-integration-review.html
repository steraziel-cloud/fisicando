<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica Identikit della materia</title>
<link rel="stylesheet" href="../assets/reader-matter-cards.css?v=11">
<style>body{margin:0;padding:22px;background:#eff4ed;color:#293e43;font:16px system-ui}main{max-width:1100px;margin:auto}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}select,button{font:inherit;padding:10px}#compact{border:1px solid #6b8b78;width:360px;max-width:100%}#compact iframe{border:0;width:100%;height:950px}.qa-only{margin:0 0 20px}</style>
<main><header><h1>Identikit della materia</h1><label>Carta da verificare <select id="sample"></select></label><button id="compact-toggle">Vista da telefono</button></header><div id="game"></div><div id="compact" hidden><iframe title="Gioco a larghezza telefono"></iframe></div></main>
<script src="../assets/reader-matter-models.js?v=6"></script><script src="../assets/reader-matter-approved.js?v=4"></script><script src="../assets/reader-matter-cards.js?v=12"></script>
<script src="../assets/reader-reactions.js?v=6"></script>
<script>
 const api=window.GatitoMatterCards,select=document.querySelector('#sample'),game=document.querySelector('#game');let dispose=null;
 select.innerHTML=api.deck.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');
 const initial=new URL(location.href).searchParams.get('card');select.value=api.deck.some(d=>d.id===initial)?initial:'ghiaccio';
 function mount(){dispose?.();const st={};api.resetRound(st,5);st.order=[select.value,...api.deck.filter(d=>d.id!==select.value).slice(0,4).map(d=>d.id)];st.drawn=true;st.face='back';dispose=api.mount(game,st,()=>{});}
 select.onchange=mount;mount();document.querySelector('#compact-toggle').onclick=()=>{const box=document.querySelector('#compact');box.hidden=!box.hidden;if(!box.hidden)box.querySelector('iframe').src='matter-integration-review.html?card='+select.value;};
</script></html>
