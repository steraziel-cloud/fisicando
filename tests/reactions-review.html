<main><h1>Ora c’è anche Bjorne!</h1><p>Le due nuove reazioni, nello stesso sistema usato dai quiz.</p><div class="examples"><section><h2>Risposta corretta</h2><div id="positive"></div></section><section><h2>Risposta da rivedere</h2><div id="negative"></div></section></div><button id="replay" type="button">Rivedi le due animazioni</button><footer><a href="../reader.html?lezione=chimica-materia&amp;livello=medie">Torna alla lezione sulla materia</a></footer></main>
<script src="../assets/reader-reactions.js?v=9"></script><script>
// Advance the shared rotation to its third entry, Bjorne. Replaying a full
// six-item cycle keeps the preview on the same pair without a separate API.
function preview(count){for(let i=0;i<count;i++){GatitoQuizReactions.show(document.querySelector('#positive'),'Hai riconosciuto gli indizi!',{correct:true,title:'Ci siamo!'});GatitoQuizReactions.show(document.querySelector('#negative'),'Riguardiamo gli indizi e riproviamo.',{correct:false,title:'Un altro tentativo!'});}}
preview(3);document.querySelector('#replay').onclick=()=>preview(6);
</script></html>
