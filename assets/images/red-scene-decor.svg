<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700">
  <defs>
    <linearGradient id="blueA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfeefa" stop-opacity=".96"/>
      <stop offset="1" stop-color="#86d8ee" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="blueB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ddff2" stop-opacity=".92"/>
      <stop offset="1" stop-color="#58c7e7" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe7a7" stop-opacity=".18"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#fff3df"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#37536f" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- large layered editorial blobs -->
  <path d="M164 395C105 292 126 181 223 112c83-59 191-55 278-20 70 28 133 16 201 43 113 46 183 146 165 258-17 108-112 196-225 229-120 36-294 21-397-44-70-44-118-109-81-183Z" fill="url(#blueA)"/>
  <path d="M281 160c91-75 215-85 315-43 78 33 166 21 224 83 65 70 71 180 20 267-51 86-150 139-257 142-115 4-245-31-320-105-76-75-83-189-32-275 15-25 30-47 50-69Z" fill="url(#blueB)" opacity=".92"/>
  <path d="M616 114c88-7 176 36 218 99 42 65 42 153 5 219-35 63-103 112-177 126-49 9-101 4-141-24-68-48-98-138-75-218 19-66 82-194 170-202Z" fill="url(#warm)"/>

  <!-- motion lines -->
  <path d="M184 438C300 250 585 188 800 302c66 35 112 88 131 145" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="8" stroke-linecap="round"/>
  <path d="M233 498C386 404 598 395 782 470" fill="none" stroke="#dff8ff" stroke-opacity=".92" stroke-width="6" stroke-linecap="round"/>
  <path d="M205 445c89-112 236-160 379-136" fill="none" stroke="#32bad8" stroke-opacity=".72" stroke-width="4" stroke-dasharray="12 18" stroke-linecap="round"/>

  <!-- realistic floating study notes -->
  <g filter="url(#paperShadow)">
    <!-- Idea / lampadina -->
    <g transform="translate(112 236) rotate(-13)">
      <path d="M8 0h104c8 0 12 5 12 12v88c0 8-5 12-12 12H8c-8 0-12-5-12-12V12C-4 5 0 0 8 0Z" fill="url(#paper)" stroke="#ead9bd"/>
      <circle cx="60" cy="48" r="20" fill="none" stroke="#6aa9d7" stroke-width="4"/>
      <path d="M49 63h22M53 70h14" stroke="#6aa9d7" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 18v10M35 28l8 7M85 28l-8 7" stroke="#f2b94b" stroke-width="4" stroke-linecap="round"/>
      <path d="M19 88h82" stroke="#d4b684" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <circle cx="103" cy="14" r="4" fill="#5dc5dc" opacity=".65"/>
    </g>

    <!-- Geometria -->
    <g transform="translate(772 210) rotate(11)">
      <path d="M7 0h108c8 0 12 5 12 12v92c0 8-5 12-12 12H7c-8 0-12-5-12-12V12C-5 5 0 0 7 0Z" fill="url(#paper)" stroke="#ead9bd"/>
      <path d="M63 22 96 75H31Z" fill="none" stroke="#659ed3" stroke-width="4.5"/>
      <path d="M48 68h31M63 39v33" stroke="#659ed3" stroke-width="3.5" opacity=".85"/>
      <path d="M29 88q34-12 68 0" fill="none" stroke="#e2ba70" stroke-width="3" stroke-linecap="round"/>
      <path d="M17 18l10 4M105 17l-9 5" stroke="#87bfe4" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Grafico / metodo -->
    <g transform="translate(806 430) rotate(-9)">
      <path d="M8 0h104c8 0 12 5 12 12v86c0 8-5 12-12 12H8c-8 0-12-5-12-12V12C-4 5 0 0 8 0Z" fill="url(#paper)" stroke="#ead9bd"/>
      <path d="M25 78V27M25 78h70" stroke="#6aa9d7" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M31 68c15-3 17-23 31-24 14-1 15 19 29 11" fill="none" stroke="#f0b54a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="62" cy="44" r="3.5" fill="#5dc5dc"/>
      <path d="M38 92h50" stroke="#d4b684" stroke-width="3" stroke-linecap="round" opacity=".65"/>
    </g>

    <!-- Scienze / atomo + formula -->
    <g transform="translate(170 354) rotate(9)">
      <path d="M7 0h92c8 0 12 5 12 12v78c0 8-5 12-12 12H7c-8 0-12-5-12-12V12C-5 5 0 0 7 0Z" fill="url(#paper)" stroke="#ead9bd"/>
      <g transform="translate(52 43)" fill="none" stroke="#6aa9d7" stroke-width="3">
        <ellipse rx="26" ry="10"/>
        <ellipse rx="26" ry="10" transform="rotate(60)"/>
        <ellipse rx="26" ry="10" transform="rotate(120)"/>
        <circle r="4" fill="#f0b54a" stroke="none"/>
      </g>
      <text x="52" y="86" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="12" font-weight="800" fill="#71869c">π · Σ · E=mc²</text>
    </g>
  </g>

  <!-- sparkles and small paw accents -->
  <g fill="#ffc247">
    <path d="M284 177l8 19 19 8-19 8-8 19-8-19-19-8 19-8Z"/>
    <path d="M824 356l8 19 19 8-19 8-8 19-8-19-19-8 19-8Z"/>
    <path d="M686 134l7 16 16 7-16 7-7 16-7-16-16-7 16-7Z"/>
    <path d="M722 520l6 14 14 6-14 6-6 14-6-14-14-6 14-6Z"/>
  </g>
  <g fill="#ffffff" opacity=".9">
    <circle cx="192" cy="514" r="5"/><circle cx="192" cy="496" r="4"/><circle cx="180" cy="501" r="4"/><circle cx="204" cy="501" r="4"/>
    <circle cx="741" cy="190" r="5"/><circle cx="741" cy="172" r="4"/><circle cx="729" cy="177" r="4"/><circle cx="753" cy="177" r="4"/>
  </g>

  <!-- ground -->
  <ellipse cx="528" cy="607" rx="330" ry="54" fill="#68b8df" opacity=".28" filter="url(#soft)"/>
  <ellipse cx="528" cy="594" rx="292" ry="35" fill="#bfeefa" opacity=".34"/>
</svg>