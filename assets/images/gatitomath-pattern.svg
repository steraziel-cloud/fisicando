<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520">
  <g fill="none" stroke="#20aebb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- paw -->
    <g transform="translate(52 58) rotate(-17) scale(.92)" opacity=".15">
      <ellipse cx="0" cy="13" rx="14" ry="11" fill="#20aebb" stroke="none"/>
      <ellipse cx="-14" cy="-2" rx="5" ry="7" fill="#20aebb" stroke="none"/>
      <ellipse cx="-4" cy="-9" rx="5" ry="7" fill="#20aebb" stroke="none"/>
      <ellipse cx="7" cy="-9" rx="5" ry="7" fill="#20aebb" stroke="none"/>
      <ellipse cx="16" cy="-1" rx="5" ry="7" fill="#20aebb" stroke="none"/>
    </g>

    <!-- cat face -->
    <g transform="translate(246 43) rotate(9) scale(.88)" opacity=".13">
      <path d="M-24 3 L-19-22 L-3-10 M24 3 L19-22 L3-10"/>
      <path d="M-24 3 Q-23 28 0 30 Q23 28 24 3"/>
      <path d="M-10 8 q4 4 8 0 M10 8 q-4 4-8 0 M-3 17 q3 3 6 0"/>
    </g>

    <!-- atom -->
    <g transform="translate(465 86) rotate(-11) scale(1.08)" opacity=".16">
      <ellipse rx="31" ry="12"/><ellipse rx="31" ry="12" transform="rotate(60)"/>
      <ellipse rx="31" ry="12" transform="rotate(120)"/><circle r="3.5" fill="#20aebb" stroke="none"/>
    </g>

    <!-- graph -->
    <g transform="translate(682 39) rotate(4) scale(.9)" opacity=".13">
      <path d="M-34 27 V-24 M-34 27 H37"/>
      <path d="M-28 18 C-15 15-12-8 1-7 S17 18 33-18"/>
    </g>

    <!-- triangle -->
    <g transform="translate(132 188) rotate(-19) scale(.82)" opacity=".14">
      <path d="M-34 25 L7-31 L36 25 Z M-13 15 L7-12 L21 15 Z"/>
    </g>

    <!-- Bjorne box -->
    <g transform="translate(348 157) rotate(12) scale(.92)" opacity=".15">
      <path d="M-30-20 L0-34 L31-20 L0-5 Z M-30-20 V18 L0 34 L31 18 V-20 M0-5 V34"/>
      <path d="M-8 8 q8-8 16 0 q4 9-8 14 q-12-5-8-14" opacity=".75"/>
    </g>

    <!-- flask -->
    <g transform="translate(608 205) rotate(-8) scale(1.02)" opacity=".14">
      <path d="M-9-31 H9 M-5-31 V-8 L-25 25 Q-29 32-18 32 H18 Q29 32 25 25 L5-8 V-31"/>
      <path d="M-18 19 Q0 10 18 19"/><circle cx="-5" cy="22" r="2"/><circle cx="7" cy="17" r="2"/>
    </g>

    <!-- gear -->
    <g transform="translate(730 279) rotate(17) scale(.72)" opacity=".12">
      <circle r="25"/><circle r="9"/>
      <path d="M0-34 V-25 M0 25 V34 M-34 0 H-25 M25 0 H34 M-24-24 L-18-18 M18 18 L24 24 M24-24 L18-18 M-18 18 L-24 24"/>
    </g>

    <!-- book -->
    <g transform="translate(74 360) rotate(11) scale(1.03)" opacity=".16">
      <path d="M0 24 Q-19 12-39 16 V-20 Q-18-24 0-10 Z M0 24 Q19 12 39 16 V-20 Q18-24 0-10 Z"/>
      <path d="M0-10 V24"/>
    </g>

    <!-- pi -->
    <g transform="translate(260 298) rotate(-7) scale(.82)" opacity=".12" stroke-width="3">
      <path d="M-22-19 H21 M-12-19 V21 M12-19 V21"/>
    </g>

    <!-- sigma -->
    <g transform="translate(415 380) rotate(8) scale(1.02)" opacity=".14" stroke-width="3">
      <path d="M-18-20 H18 L-7 0 L19 21 H-19"/>
    </g>

    <!-- lightbulb -->
    <g transform="translate(555 337) rotate(-13) scale(.88)" opacity=".15">
      <path d="M-17-9 Q-17-30 0-32 Q17-30 17-9 Q15 1 8 7 V15 H-8 V7 Q-15 1-17-9 Z M-8 21 H8"/>
      <path d="M0-43 V-51 M-28-31 L-34-37 M28-31 L34-37 M-31-5 H-40 M31-5 H40"/>
    </g>

    <!-- circuit -->
    <g transform="translate(694 454) rotate(6) scale(.86)" opacity=".13">
      <path d="M-40-17 H-18 V-29 H5 V-8 H34 M-40 17 H-5 V6 H18 V22 H40"/>
      <circle cx="-40" cy="-17" r="3" fill="#20aebb"/><circle cx="34" cy="-8" r="3" fill="#20aebb"/>
      <circle cx="-40" cy="17" r="3" fill="#20aebb"/><circle cx="40" cy="22" r="3" fill="#20aebb"/>
    </g>

    <!-- small second paw -->
    <g transform="translate(205 470) rotate(21) scale(.62)" opacity=".11">
      <ellipse cx="0" cy="13" rx="14" ry="11" fill="#20aebb" stroke="none"/>
      <ellipse cx="-14" cy="-2" rx="5" ry="7" fill="#20aebb" stroke="none"/>
      <ellipse cx="-4" cy="-9" rx="5" ry="7" fill="#20aebb" stroke="none"/>
      <ellipse cx="7" cy="-9" rx="5" ry="7" fill="#20aebb" stroke="none"/>
      <ellipse cx="16" cy="-1" rx="5" ry="7" fill="#20aebb" stroke="none"/>
    </g>

    <!-- playful paths -->
    <path d="M104 102 C151 123 137 151 174 162" stroke-dasharray="5 10" opacity=".10"/>
    <path d="M488 248 C450 273 479 302 518 286" stroke-dasharray="5 10" opacity=".11"/>
    <path d="M304 430 C328 407 352 435 370 414" stroke-dasharray="4 11" opacity=".09"/>
  </g>
